[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lee-toolbox-backend"
version = "0.1.0"
description = "Local-first extensible toolbox service"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "imageio-ffmpeg>=0.6,<1", "Pillow>=12.3,<13", "pillow-heif>=1.8.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["native/*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
